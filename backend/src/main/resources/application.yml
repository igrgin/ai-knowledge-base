server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: ai-knowledge-base
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 2000
      initialization-fail-timeout: -1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
