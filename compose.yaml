name: ai-knowledge-base
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge_base}
      POSTGRES_USER: ${DB_USER:-knowledge_base}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
